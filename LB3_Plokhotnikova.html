<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab_3</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            color: #e8e8e8;
            margin: 20px;
            background-color: #141314;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 18px;
        }

        section {
            margin-bottom: 50px;
            padding: 24px;
            border: 1px solid #2a2a2a;
            background-color: #1a1a1a;
            border-radius: 6px;
        }

        p {
            font-family: 'Rajdhani', sans-serif;
            color: #e8e8e8;
            letter-spacing: 0.5px;
        }

        #randomImage {
            position: absolute;
            width: 80px;
            transition: left 0.3s ease, top 0.3s ease;
        }

        #clock {
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            font-weight: 700;
            color: #c9a84c;
            letter-spacing: 6px;
        }

        #eraseBlock {
            width: 400px;
            height: 200px;
            background: linear-gradient(to right, #c9a84c, #00b4d8);
            overflow: hidden;
            transition: width 0.2s;
            border-radius: 6px;
        }

        button {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            background-color: transparent;
            height: 40px;
            width: 180px;
            border: 1px solid #c9a84c;
            border-radius: 6px;
            color: #c9a84c;
            cursor: pointer;
        }

        #erase {
            margin-top: 16px;
        }
    </style>
</head>
<body>
<section>
    <h2>1. Текст з різним розміром шрифту</h2>

    <div id="textContainer"></div>

    <script>
        function showText(text, size) {
            const div = document.getElementById("textContainer");

            div.innerHTML += `
                <p style="font-size:${size}px">
                    ${text}
                </p>
                `
        }

        showText("Маленький текст", 14);
        showText("Середній текст", 24);
        showText("Великий текст", 40);
    </script>
</section>

<section>
    <h2>2. Картинка в новому місці кожну секунду</h2>

    <img
            id="randomImage"
            src="https://cdn-icons-png.flaticon.com/512/616/616408.png"
            alt="doggy"
    >

    <script>
        const img = document.getElementById("randomImage");

        setInterval(function() {

            img.style.left = Math.random() * 500 + "px";

            img.style.top =
                window.scrollY + Math.random() * 300 + "px";

        }, 1000);
    </script>
</section>

<section>
    <h2>3. Змінити всі p на 15px</h2>

    <p>Перший абзац</p>
    <p>Другий абзац</p>
    <p>Третій абзац</p>

    <button onclick="changeParagraphs()">
        Змінити розмір
    </button>

    <script>
        function changeParagraphs() {

            const paragraphs = document.getElementsByTagName("p");

            for (let i = 0; i < paragraphs.length; i++) {

                paragraphs[i].setAttribute(
                    "style",
                    "font-size:15px"
                );
            }
        }
    </script>
</section>

<section>
    <h2>4. Текстовий годинник</h2>

    <div id="clock"></div>

    <script>
        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;

            document.getElementById("clock").innerText =
                `${hours}:${minutes}:${seconds}`;
        }

        updateClock();

        setInterval(updateClock, 1000);
    </script>
</section>

<section>
    <h2>5. Ефект поступового витирання</h2>

    <div id="eraseBlock"></div>

    <button id="erase" onclick="startErase()">
        Запустити ефект
    </button>

    <script>
        function startErase() {

            const block =
                document.getElementById("eraseBlock");

            let width = 400;

            const timer = setInterval(function() {

                width -= 5;

                block.style.width = width + "px";

                if (width <= 0) {
                    clearInterval(timer);
                }

            }, 50);
        }
    </script>
</section>

</body>
</html>
