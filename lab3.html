<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Завдання</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        section {
            margin-bottom: 50px;
            padding: 15px;
            border: 1px solid #ccc;
        }

        #randomImage {
            position: absolute;
            width: 80px;
        }

        #clock {
            font-size: 30px;
            font-weight: bold;
        }

        #eraseBlock {
            width: 400px;
            height: 200px;
            background: linear-gradient(to right, steelblue, lightblue);
            overflow: hidden;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
<section>
    <h2>1. Текст з різним розміром шрифту</h2>

    <div id="textContainer"></div>

    <script>
        function showText(text, size) {
            const div = document.getElementById("textContainer");

            div.innerHTML += `
                <p style="font-size:${size}px">
                    ${text}
                </p>
            `
        }

        showText("Маленький текст", 14);
        showText("Середній текст", 24);
        showText("Великий текст", 40);
    </script>
</section>

<section>
    <h2>2. Картинка в новому місці кожну секунду</h2>

    <img
            id="randomImage"
            src="https://cdn-icons-png.flaticon.com/512/616/616408.png"
            alt="doggy"
    >

    <script>
        const img = document.getElementById("randomImage");

        setInterval(function() {

            img.style.left = Math.random() * 500 + "px";

            img.style.top =
                window.scrollY + Math.random() * 300 + "px";

        }, 1000);
    </script>
</section>

<section>
    <h2>3. Змінити всі p на 15px</h2>

    <p>Перший абзац</p>
    <p>Другий абзац</p>
    <p>Третій абзац</p>

    <button onclick="changeParagraphs()">
        Змінити розмір
    </button>

    <script>
        function changeParagraphs() {

            const paragraphs = document.getElementsByTagName("p");

            for (let i = 0; i < paragraphs.length; i++) {

                paragraphs[i].setAttribute(
                    "style",
                    "font-size:15px"
                );
            }
        }
    </script>
</section>

<section>
    <h2>4. Текстовий годинник</h2>

    <div id="clock"></div>

    <script>
        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;

            document.getElementById("clock").innerText =
                `${hours}:${minutes}:${seconds}`;
        }

        updateClock();

        setInterval(updateClock, 1000);
    </script>
</section>

<section>
    <h2>5. Ефект поступового витирання</h2>

    <div id="eraseBlock"></div>

    <button onclick="startErase()">
        Запустити ефект
    </button>

    <script>
        function startErase() {

            const block =
                document.getElementById("eraseBlock");

            let width = 400;

            const timer = setInterval(() => {

                width -= 5;

                block.style.width = width + "px";

                if (width <= 0) {
                    clearInterval(timer);
                }

            }, 50);
        }
    </script>
</section>

</body>
</html>
